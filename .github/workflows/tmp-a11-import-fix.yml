name: tmp-a11-import-fix

on:
  push:
    branches: ["tmp/a11-import-fix"]
    paths:
      - ".github/workflows/tmp-a11-import-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/a11-import-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'
      - name: Apply import-only Ruff fix
        run: python -m ruff check --select I --fix src/argentina_geography/relations/ceur_2010_2022.py
      - name: Commit formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git add src/argentina_geography/relations/ceur_2010_2022.py
          git commit -m 'A11: fix Ruff import ordering'
          git push origin HEAD:tmp/a11-import-fix

name: source-proof-indec-2022-ign-department-relation

on:
  workflow_dispatch:
  push:
    branches: ["feat/ign-administrative-relation"]
    paths:
      - "config/relations/indec_2022_radio_ign_department.json"
      - "config/sources/ign_administrative_department.json"
      - "src/argentina_geography/relations/indec_2022_ign_department.py"
      - "src/argentina_geography/sources/ign_department.py"
      - "tests/test_indec_2022_ign_department_relation.py"
      - ".github/workflows/source-indec-2022-ign-department-relation.yml"

concurrency:
  group: source-proof-indec-2022-ign-department-relation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  national-relation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            src
            config
            tests
          sparse-checkout-cone-mode: false
      - name: Check out exact spatial relation kernel
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/spatial-data-foundation
          ref: 92080025305e634deb6fec45b20068ef513c64b2
          path: _foundation/spatial-data-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Override dependency with exact foundation checkout
        run: |
          test "$(git -C _foundation/spatial-data-foundation rev-parse HEAD)" = \
            "92080025305e634deb6fec45b20068ef513c64b2"
          test "$(git -C _foundation/spatial-data-foundation hash-object src/spatial_foundation/geography/overlap.py)" = \
            "5825f248beb30fc693de346d9d430b0b73bd6b37"
          python -m pip install --no-deps -e _foundation/spatial-data-foundation
      - name: Test A10 source and relation boundaries
        run: |
          python -m pytest -q \
            tests/test_ign_department.py \
            tests/test_indec_2022_ign_department_relation.py
      - name: Acquire current official INDEC 2022 source bytes
        run: |
          python -m argentina_geography.sources.indec_2022_radio_probe \
            --source-out /tmp/indec-radios-2022.zip \
            --output /tmp/indec-2022-radio-raw-evidence.json
      - name: Materialize current INDEC 2022 geography
        run: |
          python -m argentina_geography.sources.indec_2022_radio materialize \
            --source /tmp/indec-radios-2022.zip \
            --output /tmp/indec-2022-radio
      - name: Rehydrate exact released A2 identity after normalized-content proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from argentina_geography.products import write_checksums, write_json
          from argentina_geography.sources.indec_2022_radio import REQUIRED_OUTPUT_FILES

          relation_config = json.loads(
              Path("config/relations/indec_2022_radio_ign_department.json").read_text()
          )
          expected = relation_config["source_parent"]
          release = Path("/tmp/indec-2022-radio")
          manifest_path = release / "manifest.json"
          manifest = json.loads(manifest_path.read_text())

          observed_version = manifest["dataset"]["version"]
          observed_snapshot = manifest["source_snapshot"]["snapshot_id"]
          observed_content = manifest["dataset"]["content_sha256"]
          observed_file = manifest["source_snapshot"]["files"][0]
          if observed_content != expected["content_sha256"]:
              raise SystemExit(
                  "INDEC normalized geography drift: "
                  f"expected {expected['content_sha256']}, found {observed_content}"
              )

          release_sha = expected["source_snapshot_sha256"]
          release_snapshot = "sha256:" + release_sha
          release_size = 67278396
          evidence = {
              "equivalence_basis": "normalized_geography_sha256",
              "released_version": expected["release_version"],
              "released_source_snapshot_sha256": release_sha,
              "released_source_size_bytes": release_size,
              "observed_live_release_version": observed_version,
              "observed_live_source_snapshot": observed_snapshot,
              "observed_live_source_file_sha256": observed_file["sha256"],
              "observed_live_source_size_bytes": observed_file["size_bytes"],
              "normalized_content_sha256": observed_content,
              "normalized_content_equal": True,
          }
          write_json(Path("/tmp/indec-a2-live-repack-evidence.json"), evidence)

          manifest["dataset"]["version"] = expected["release_version"]
          manifest["run"]["outputs"][0]["version"] = expected["release_version"]
          manifest["run"]["run_id"] = f"indec-2022-radio:{release_sha[:16]}"
          for snapshot in (manifest["source_snapshot"], manifest["run"]["inputs"][0]):
              snapshot["snapshot_id"] = release_snapshot
              for source_file in snapshot["files"]:
                  source_file["sha256"] = release_sha
                  source_file["size_bytes"] = release_size
          manifest["run"]["parameters"]["live_wfs_repack_equivalence"] = evidence
          manifest["live_wfs_repack_equivalence"] = evidence
          write_json(manifest_path, manifest)

          catalog_path = release / "geography_catalog.parquet"
          catalog = pd.read_parquet(catalog_path)
          catalog.loc[:, "release_version"] = expected["release_version"]
          catalog.to_parquet(catalog_path, index=False)

          limitations_path = release / "limitations.json"
          limitations = json.loads(limitations_path.read_text())
          limitations["release_version"] = expected["release_version"]
          limitations["live_wfs_repack_equivalence"] = evidence
          write_json(limitations_path, limitations)

          write_checksums(release, REQUIRED_OUTPUT_FILES)
          PY
          python -m argentina_geography.sources.indec_2022_radio verify \
            --release /tmp/indec-2022-radio
      - name: Acquire exact pinned IGN department archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from argentina_geography.sources.ign_department import download_source, load_config
          download_source(Path("/tmp/ign_departamento.zip"), load_config())
          PY
      - name: Materialize exact IGN department Geography Release
        run: |
          python -m argentina_geography.sources.ign_department materialize \
            --source /tmp/ign_departamento.zip \
            --output /tmp/ign-department-release
      - name: Materialize exact national A10 relation
        run: |
          python -m argentina_geography.relations.indec_2022_ign_department materialize \
            --indec-release /tmp/indec-2022-radio \
            --ign-release /tmp/ign-department-release \
            --output /tmp/indec-2022-ign-department-relation
      - name: Verify detached relation
        run: |
          cp -R /tmp/indec-2022-ign-department-relation \
            /tmp/indec-2022-ign-department-relation-detached
          python -m argentina_geography.relations.indec_2022_ign_department verify \
            --release /tmp/indec-2022-ign-department-relation-detached
      - name: Emit quantitative relation QA
        run: |
          cat /tmp/indec-2022-ign-department-relation/manifest.json
          cat /tmp/indec-2022-ign-department-relation/qa.json
          cat /tmp/indec-2022-ign-department-relation/relation_summary.md
      - name: Prepare non-geometric A10 evidence
        run: |
          mkdir -p /tmp/a10-relation-evidence
          cp /tmp/indec-a2-live-repack-evidence.json /tmp/a10-relation-evidence/
          cp /tmp/indec-2022-radio-raw-evidence.json /tmp/a10-relation-evidence/
          cp /tmp/indec-2022-radio/manifest.json \
            /tmp/a10-relation-evidence/indec-parent-manifest.json
          cp /tmp/ign-department-release/manifest.json \
            /tmp/a10-relation-evidence/ign-parent-manifest.json
          cp /tmp/ign-department-release/qa.json \
            /tmp/a10-relation-evidence/ign-parent-qa.json
          cp /tmp/indec-2022-ign-department-relation/manifest.json \
            /tmp/a10-relation-evidence/
          cp /tmp/indec-2022-ign-department-relation/qa.json \
            /tmp/a10-relation-evidence/
          cp /tmp/indec-2022-ign-department-relation/relation_summary.json \
            /tmp/a10-relation-evidence/
          cp /tmp/indec-2022-ign-department-relation/relation_summary.md \
            /tmp/a10-relation-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: indec-2022-ign-department-a10-evidence
          path: /tmp/a10-relation-evidence
          if-no-files-found: error

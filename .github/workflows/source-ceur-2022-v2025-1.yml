name: source-proof-ceur-2022-v2025-1

on:
  workflow_dispatch:
  push:
    branches: ["feat/ceur-2022-v2025-1-radio"]
    paths:
      - "config/sources/ceur_census_2022_radio_v2025_1.json"
      - "src/argentina_geography/sources/ceur_2022_v2025_1.py"
      - "src/argentina_geography/sources/ceur_2022_v2025_1_probe.py"
      - ".github/workflows/source-ceur-2022-v2025-1.yml"

concurrency:
  group: source-proof-ceur-2022-v2025-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Probe CEUR V2025-1 source
        run: |
          python -m argentina_geography.sources.ceur_2022_v2025_1_probe \
            --source-out /tmp/RADIOS_2022_V2025-1.zip \
            --output /tmp/ceur-2022-v2025-1-raw-evidence.json
      - name: Upload raw source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ceur-2022-v2025-1-raw-evidence
          path: /tmp/ceur-2022-v2025-1-raw-evidence.json
          if-no-files-found: error
      - name: Materialize exact probed snapshot
        run: |
          python -m argentina_geography.sources.ceur_2022_v2025_1 materialize \
            --source /tmp/RADIOS_2022_V2025-1.zip \
            --output /tmp/ceur-2022-v2025-1
      - name: Verify detached product
        run: |
          cp -R /tmp/ceur-2022-v2025-1 /tmp/ceur-2022-v2025-1-detached
          python -m argentina_geography.sources.ceur_2022_v2025_1 verify \
            --release /tmp/ceur-2022-v2025-1-detached
      - name: Prepare non-geometric release evidence
        run: |
          mkdir -p /tmp/source-evidence
          cp /tmp/ceur-2022-v2025-1/manifest.json /tmp/source-evidence/
          cp /tmp/ceur-2022-v2025-1/qa.json /tmp/source-evidence/
          cp /tmp/ceur-2022-v2025-1/source_metadata.json /tmp/source-evidence/
          cp /tmp/ceur-2022-v2025-1/limitations.json /tmp/source-evidence/
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ceur-2022-v2025-1-source-evidence
          path: /tmp/source-evidence
          if-no-files-found: error

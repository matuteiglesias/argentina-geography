name: source-probe-ign-department-static-a10

on:
  push:
    branches: ["feat/ign-administrative-relation"]
    paths:
      - ".github/workflows/source-ign-static-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vector reader
        run: python -m pip install "geopandas>=1.1" "pyogrio>=0.10" "pyarrow>=15"
      - name: Retrieve and inspect official department SHAPE
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.ign.gob.ar/descargas/geodatos/SHAPES/ign_departamento.zip'
          curl --fail --location --retry 2 --user-agent 'argentina-geography/0.1 research-data-client' "$URL" -o /tmp/ign-departamento.zip
          echo "retrieved_at_utc=$(date --utc --iso-8601=seconds)"
          echo "url=$URL"
          sha256sum /tmp/ign-departamento.zip
          stat --printf='%n %s bytes\n' /tmp/ign-departamento.zip
          python - <<'PY'
          import json
          import geopandas as gpd
          frame = gpd.read_file('/vsizip//tmp/ign-departamento.zip/ign_departamento/ign_departamento.shp', engine='pyogrio', use_arrow=True)
          geom = frame.geometry
          out = {
              'feature_count': len(frame),
              'columns': frame.columns.tolist(),
              'dtypes': {c: str(frame[c].dtype) for c in frame.columns if c != geom.name},
              'unique_counts': {c: int(frame[c].nunique(dropna=True)) for c in frame.columns if c != geom.name},
              'null_counts': {c: int(frame[c].isna().sum()) for c in frame.columns if c != geom.name},
              'samples': {c: frame[c].dropna().astype(str).drop_duplicates().head(10).tolist() for c in frame.columns if c != geom.name},
              'crs': None if frame.crs is None else frame.crs.to_string(),
              'geometry_types': sorted(geom.geom_type.dropna().unique().tolist()),
              'missing_geometry_count': int(geom.isna().sum()),
              'empty_geometry_count': int(geom.is_empty.sum()),
              'invalid_geometry_count': int((geom.notna() & ~geom.is_valid).sum()),
              'bbox': [float(v) for v in frame.total_bounds.tolist()],
          }
          print(json.dumps(out, indent=2, ensure_ascii=False, sort_keys=True))
          PY

name: source-proof-indec-ceur-2022-relation

on:
  workflow_dispatch:
  push:
    branches: ["feat/indec-ceur-2022-relation"]
    paths:
      - "config/relations/indec_ceur_census_2022_radio.json"
      - "src/argentina_geography/relations/indec_ceur_2022.py"
      - "tests/test_indec_ceur_2022_relation.py"
      - ".github/workflows/source-indec-ceur-2022-relation.yml"

concurrency:
  group: source-proof-indec-ceur-2022-relation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  national-relation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact current foundation kernel
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/spatial-data-foundation
          ref: 92080025305e634deb6fec45b20068ef513c64b2
          path: _foundation/spatial-data-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Override with exact current foundation checkout
        run: |
          test "$(git -C _foundation/spatial-data-foundation rev-parse HEAD)" = \
            "92080025305e634deb6fec45b20068ef513c64b2"
          python -m pip install --no-deps -e _foundation/spatial-data-foundation
      - name: Test A5 against exact current foundation
        run: python -m pytest -q tests/test_indec_ceur_2022_relation.py
      - name: Acquire exact current INDEC source bytes
        run: |
          python -m argentina_geography.sources.indec_2022_radio_probe \
            --source-out /tmp/indec-radios-2022.zip \
            --output /tmp/indec-2022-radio-raw-evidence.json
      - name: Acquire exact current CEUR V2025-1 source bytes
        run: |
          python -m argentina_geography.sources.ceur_2022_v2025_1_probe \
            --source-out /tmp/RADIOS_2022_V2025-1.zip \
            --output /tmp/ceur-2022-v2025-1-raw-evidence.json
      - name: Materialize current INDEC geography
        run: |
          python -m argentina_geography.sources.indec_2022_radio materialize \
            --source /tmp/indec-radios-2022.zip \
            --output /tmp/indec-2022-radio
      - name: Rehydrate pinned A2 identity after normalized-content proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          from argentina_geography.products import write_checksums, write_json
          from argentina_geography.sources.indec_2022_radio import REQUIRED_OUTPUT_FILES

          relation_config = json.loads(
              Path("config/relations/indec_ceur_census_2022_radio.json").read_text()
          )
          expected = relation_config["source_parent"]
          release = Path("/tmp/indec-2022-radio")
          manifest_path = release / "manifest.json"
          manifest = json.loads(manifest_path.read_text())

          observed_version = manifest["dataset"]["version"]
          observed_snapshot = manifest["source_snapshot"]["snapshot_id"]
          observed_content = manifest["dataset"]["content_sha256"]
          observed_file = manifest["source_snapshot"]["files"][0]
          if observed_content != expected["content_sha256"]:
              raise SystemExit(
                  "INDEC normalized geography drift: "
                  f"expected {expected['content_sha256']}, found {observed_content}"
              )

          canonical_sha = expected["source_snapshot_sha256"]
          canonical_snapshot = "sha256:" + canonical_sha
          canonical_size = 67278396
          evidence = {
              "equivalence_basis": "normalized_geography_sha256",
              "canonical_release_version": expected["release_version"],
              "canonical_source_snapshot_sha256": canonical_sha,
              "canonical_source_size_bytes": canonical_size,
              "observed_live_release_version": observed_version,
              "observed_live_source_snapshot": observed_snapshot,
              "observed_live_source_file_sha256": observed_file["sha256"],
              "observed_live_source_size_bytes": observed_file["size_bytes"],
              "normalized_content_sha256": observed_content,
              "normalized_content_equal": True,
          }
          write_json(Path("/tmp/indec-a2-live-repack-evidence.json"), evidence)

          manifest["dataset"]["version"] = expected["release_version"]
          manifest["run"]["outputs"][0]["version"] = expected["release_version"]
          manifest["run"]["run_id"] = f"indec-2022-radio:{canonical_sha[:16]}"
          for snapshot in (manifest["source_snapshot"], manifest["run"]["inputs"][0]):
              snapshot["snapshot_id"] = canonical_snapshot
              for source_file in snapshot["files"]:
                  source_file["sha256"] = canonical_sha
                  source_file["size_bytes"] = canonical_size
          manifest["run"]["parameters"]["live_wfs_repack_equivalence"] = evidence
          manifest["live_wfs_repack_equivalence"] = evidence
          write_json(manifest_path, manifest)

          catalog_path = release / "geography_catalog.parquet"
          catalog = pd.read_parquet(catalog_path)
          catalog.loc[:, "release_version"] = expected["release_version"]
          catalog.to_parquet(catalog_path, index=False)

          limitations_path = release / "limitations.json"
          limitations = json.loads(limitations_path.read_text())
          limitations["release_version"] = expected["release_version"]
          limitations["live_wfs_repack_equivalence"] = evidence
          write_json(limitations_path, limitations)

          write_checksums(release, REQUIRED_OUTPUT_FILES)
          PY
          python -m argentina_geography.sources.indec_2022_radio verify \
            --release /tmp/indec-2022-radio
      - name: Materialize exact CEUR parent release
        run: |
          python -m argentina_geography.sources.ceur_2022_v2025_1 materialize \
            --source /tmp/RADIOS_2022_V2025-1.zip \
            --output /tmp/ceur-2022-v2025-1
      - name: Materialize exact national relation
        run: |
          python -m argentina_geography.relations.indec_ceur_2022 materialize \
            --indec-release /tmp/indec-2022-radio \
            --ceur-release /tmp/ceur-2022-v2025-1 \
            --output /tmp/indec-ceur-2022-relation
      - name: Verify detached relation
        run: |
          cp -R /tmp/indec-ceur-2022-relation /tmp/indec-ceur-2022-relation-detached
          python -m argentina_geography.relations.indec_ceur_2022 verify \
            --release /tmp/indec-ceur-2022-relation-detached
      - name: Prepare non-geometric relation evidence
        run: |
          mkdir -p /tmp/relation-evidence
          cp /tmp/indec-a2-live-repack-evidence.json /tmp/relation-evidence/
          cp /tmp/indec-2022-radio-raw-evidence.json /tmp/relation-evidence/
          cp /tmp/ceur-2022-v2025-1-raw-evidence.json /tmp/relation-evidence/
          cp /tmp/indec-2022-radio/manifest.json \
            /tmp/relation-evidence/indec-parent-manifest.json
          cp /tmp/ceur-2022-v2025-1/manifest.json \
            /tmp/relation-evidence/ceur-parent-manifest.json
          cp /tmp/indec-ceur-2022-relation/manifest.json /tmp/relation-evidence/
          cp /tmp/indec-ceur-2022-relation/qa.json /tmp/relation-evidence/
          cp /tmp/indec-ceur-2022-relation/comparison_summary.json \
            /tmp/relation-evidence/
          cp /tmp/indec-ceur-2022-relation/comparison_summary.md \
            /tmp/relation-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: indec-ceur-2022-relation-source-evidence
          path: /tmp/relation-evidence
          if-no-files-found: error

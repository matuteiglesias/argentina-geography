name: a11-mirror-probe

on:
  workflow_dispatch:
  push:
    branches: ["feat/longitudinal-census-relation"]
    paths:
      - ".github/workflows/a11-mirror-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: a11-working-source
          path: |
            src/argentina_geography/relations/ceur_2010_2022.py
            src/argentina_geography/sources/ceur_2010_v2025_1.py
            src/argentina_geography/sources/ceur_2022_v2025_1.py
            config/relations/ceur_census_2010_2022_radio.json
            tests/test_ceur_2010_2022_relation.py
            .github/workflows/source-ceur-2010-2022-relation.yml

name: a11-mirror-probe

on:
  workflow_dispatch:
  push:
    branches: ["feat/longitudinal-census-relation"]
    paths:
      - ".github/workflows/a11-mirror-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public S3 listing and candidate objects
        shell: bash
        run: |
          set +e
          echo '== bucket listing =='
          curl -fsSL 'https://arg-fulbright-data.s3.us-east-2.amazonaws.com/?list-type=2&max-keys=1000' | head -c 20000
          echo
          echo '== candidate HEADs =='
          for url in \
            'https://arg-fulbright-data.s3.us-east-2.amazonaws.com/censo-argentino-2022/radios-2022.parquet' \
            'https://arg-fulbright-data.s3.us-east-2.amazonaws.com/censo-argentino-2022/radios.parquet' \
            'https://arg-fulbright-data.s3.us-east-2.amazonaws.com/censo-argentino-2010/radios-2010.parquet' \
            'https://arg-fulbright-data.s3.us-east-2.amazonaws.com/censo-argentino-2010/radios.parquet' \
            'https://arg-fulbright-data.s3.us-east-2.amazonaws.com/censo-argentino-2010/radios_2010.parquet'; do
            echo "-- $url"
            curl -sSIL --max-time 20 "$url" | sed -n '1,12p'
          done
          exit 0

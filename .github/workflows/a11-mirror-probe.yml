name: a11-mirror-probe

on:
  workflow_dispatch:
  push:
    branches: ["feat/longitudinal-census-relation"]
    paths:
      - ".github/workflows/a11-mirror-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official CONICET dataset REST payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            'https://ri.conicet.gov.ar/rest/dataset/11336/149711' \
            --output /tmp/dataset.json
          cat /tmp/dataset.json
          echo
          echo '== pretty =='
          python -m json.tool /tmp/dataset.json

name: a11-mirror-probe

on:
  workflow_dispatch:
  push:
    branches: ["feat/longitudinal-census-relation"]
    paths:
      - ".github/workflows/a11-mirror-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Download surviving V2025-1 geometry distributions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            'https://data.source.coop/nlebovits/censo-argentino/2010/radios.parquet' \
            --output /tmp/radios-2010.parquet
          curl --fail --location --retry 3 --retry-all-errors \
            'https://data.source.coop/nlebovits/censo-argentino/2022/radios.parquet' \
            --output /tmp/radios-2022.parquet
          sha256sum /tmp/radios-2010.parquet /tmp/radios-2022.parquet
          stat -c '%n %s' /tmp/radios-2010.parquet /tmp/radios-2022.parquet
      - name: Inspect schema identity and geometry
        run: |
          python - <<'PY'
          import geopandas as gpd
          from pathlib import Path
          for vintage in (2010, 2022):
              path = Path(f'/tmp/radios-{vintage}.parquet')
              frame = gpd.read_parquet(path)
              id_field = f'COD_{vintage}'
              print(f'== {vintage} ==')
              print('rows', len(frame))
              print('crs', frame.crs.to_string())
              print('columns', list(frame.columns))
              print('geometry_types', frame.geometry.geom_type.value_counts(dropna=False).to_dict())
              print('missing_geometry', int(frame.geometry.isna().sum()))
              print('invalid_geometry_4326', int((frame.geometry.notna() & ~frame.geometry.is_valid).sum()))
              metric = frame.to_crs('EPSG:3857')
              invalid_metric = metric.geometry.notna() & ~metric.geometry.is_valid
              print('invalid_geometry_roundtrip_3857', int(invalid_metric.sum()))
              print('invalid_ids_roundtrip_3857', sorted(metric.loc[invalid_metric, id_field].astype(str).tolist()))
              values = frame[id_field].astype(str)
              print('id_field', id_field, 'unique', values.nunique(), 'widths', values.str.len().value_counts().sort_index().to_dict())
              reconstructed = frame['PROV'].astype(str).str.zfill(2) + frame['DEPTO'].astype(str).str.zfill(3) + frame['FRACC'].astype(str).str.zfill(2) + frame['RADIO'].astype(str).str.zfill(2)
              print('identity_mismatches', int((values != reconstructed).sum()))
          PY

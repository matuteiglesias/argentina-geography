name: Activate A9 electoral vertical

on:
  push:
    branches:
      - feat/census-electoral-relations-work

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand prepared A9 implementation
        run: |
          cat .bootstrap/a9.part* | base64 --decode | gzip --decompress --stdout | tar -x
          rm -rf .bootstrap
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests
          python -m ruff check src tests
          python -m pytest -q
      - name: Commit activated implementation
        run: |
          rm -f .github/workflows/a9-activate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'A9: implement electoral geography vertical'
          git push origin HEAD:feat/census-electoral-relations-work

name: source-proof-indec-2022-radio

on:
  workflow_dispatch:
  push:
    branches: ["feat/indec-2022-radio-geography"]

jobs:
  materialize-source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Materialize official INDEC source
        run: |
          python -m argentina_geography.sources.indec_2022_radio materialize \
            --output /tmp/indec-2022-radio
      - name: Verify detached product
        run: |
          cp -R /tmp/indec-2022-radio /tmp/indec-2022-radio-detached
          python -m argentina_geography.sources.indec_2022_radio verify \
            --release /tmp/indec-2022-radio-detached
      - name: Prepare non-geometric source evidence
        run: |
          mkdir -p /tmp/source-evidence
          cp /tmp/indec-2022-radio/manifest.json /tmp/source-evidence/
          cp /tmp/indec-2022-radio/qa.json /tmp/source-evidence/
          cp /tmp/indec-2022-radio/source_metadata.json /tmp/source-evidence/
          cp /tmp/indec-2022-radio/limitations.json /tmp/source-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: indec-2022-radio-source-evidence
          path: /tmp/source-evidence
          if-no-files-found: error

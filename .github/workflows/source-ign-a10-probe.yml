name: source-probe-ign-department-a10

on:
  push:
    branches: ["feat/ign-administrative-relation"]
    paths:
      - ".github/workflows/source-ign-a10-probe.yml"

concurrency:
  group: source-probe-ign-department-a10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe exact IGN department WFS request
        shell: bash
        run: |
          set -euo pipefail
          URL='https://wms.ign.gob.ar/geoserver/ign/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=ign%3Adepartamento&outputFormat=application%2Fjson&srsName=EPSG%3A4326'
          export URL
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = os.environ["URL"]
          retrieved_at = datetime.now(timezone.utc).isoformat()
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "argentina-geography/0.1 research-data-client"},
          )
          with urllib.request.urlopen(request, timeout=300) as response:
              raw = response.read()
              content_type = response.headers.get("Content-Type")
          path = Path("/tmp/ign-departamento.geojson")
          path.write_bytes(raw)
          payload = json.loads(raw)
          features = payload.get("features", [])
          property_fields = sorted({key for feature in features for key in feature.get("properties", {})})
          profiles = {}
          for field in property_fields:
              values = [feature.get("properties", {}).get(field) for feature in features]
              non_null = [value for value in values if value is not None]
              text = [str(value).strip() for value in non_null]
              samples = []
              for value in text:
                  if value not in samples:
                      samples.append(value)
                  if len(samples) == 12:
                      break
              profiles[field] = {
                  "null_count": len(values) - len(non_null),
                  "unique_count": len(set(text)),
                  "sample_values": samples,
              }
          geometry_types = sorted({
              feature.get("geometry", {}).get("type")
              for feature in features
              if feature.get("geometry") is not None
          })
          evidence = {
              "provider": "Instituto Geografico Nacional (IGN)",
              "layer": "ign:departamento",
              "request_url": url,
              "retrieved_at_utc": retrieved_at,
              "http_content_type": content_type,
              "source_sha256": hashlib.sha256(raw).hexdigest(),
              "source_size_bytes": len(raw),
              "feature_count": len(features),
              "property_fields": property_fields,
              "field_profiles": profiles,
              "geometry_types": geometry_types,
              "missing_geometry_count": sum(feature.get("geometry") is None for feature in features),
              "geojson_crs": payload.get("crs"),
              "bbox": payload.get("bbox"),
          }
          out = Path("/tmp/ign-department-probe.json")
          out.write_text(json.dumps(evidence, indent=2, ensure_ascii=False, sort_keys=True) + "\n")
          print(out.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ign-department-a10-probe
          path: |
            /tmp/ign-department-probe.json
            /tmp/ign-departamento.geojson
          if-no-files-found: error

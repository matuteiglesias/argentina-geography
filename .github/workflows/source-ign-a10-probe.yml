name: source-probe-ign-department-a10

on:
  push:
    branches: ["feat/ign-administrative-relation"]
    paths:
      - ".github/workflows/source-ign-a10-probe.yml"

concurrency:
  group: source-probe-ign-department-a10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Probe exact IGN department WFS request
        shell: bash
        run: |
          set -euo pipefail
          URL='https://wms.ign.gob.ar/geoserver/ign/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=ign%3Adepartamento&outputFormat=application%2Fjson&srsName=EPSG%3A4326'
          export URL
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          import geopandas as gpd

          url = os.environ["URL"]
          retrieved_at = datetime.now(timezone.utc).isoformat()
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "argentina-geography/0.1 research-data-client"},
          )
          with urllib.request.urlopen(request, timeout=300) as response:
              raw = response.read()
              content_type = response.headers.get("Content-Type")
          path = Path("/tmp/ign-departamento.geojson")
          path.write_bytes(raw)
          frame = gpd.read_file(path, engine="pyogrio", use_arrow=True)
          geometry = frame.geometry
          profiles = {}
          for field in frame.columns:
              if field == geometry.name:
                  continue
              values = frame[field]
              text = values.dropna().map(lambda v: str(v).strip())
              profiles[field] = {
                  "dtype": str(values.dtype),
                  "null_count": int(values.isna().sum()),
                  "unique_count": int(values.nunique(dropna=True)),
                  "sample_values": text.drop_duplicates().head(12).tolist(),
              }
          evidence = {
              "provider": "Instituto Geografico Nacional (IGN)",
              "layer": "ign:departamento",
              "request_url": url,
              "retrieved_at_utc": retrieved_at,
              "http_content_type": content_type,
              "source_sha256": hashlib.sha256(raw).hexdigest(),
              "source_size_bytes": len(raw),
              "feature_count": len(frame),
              "columns": frame.columns.tolist(),
              "crs": None if frame.crs is None else frame.crs.to_string(),
              "field_profiles": profiles,
              "geometry_types": sorted(geometry.geom_type.dropna().unique().tolist()),
              "missing_geometry_count": int(geometry.isna().sum()),
              "empty_geometry_count": int(geometry.is_empty.sum()),
              "invalid_geometry_count_after_driver_read": int((geometry.notna() & ~geometry.is_valid).sum()),
              "bbox": [float(v) for v in frame.total_bounds.tolist()],
          }
          out = Path("/tmp/ign-department-probe.json")
          out.write_text(json.dumps(evidence, indent=2, ensure_ascii=False, sort_keys=True) + "\n")
          print(out.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ign-department-a10-probe
          path: |
            /tmp/ign-department-probe.json
            /tmp/ign-departamento.geojson
          if-no-files-found: error

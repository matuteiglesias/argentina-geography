name: A8 native coddepto fix

on:
  push:
    branches:
      - feat/tartagalensis-circuit-geographies
    paths:
      - ".github/workflows/a8-native-coddepto-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tartagalensis-circuit-geographies
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve source-native coddepto width
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/argentina_geography/sources/tartagalensis_circuits.py')
          text = source.read_text()
          old = '''def _optional_department(value: object) -> str | None:\n    if pd.isna(value):\n        return None\n    if not isinstance(value, str):\n        raise TypeError(\n            "coddepto must remain a three-digit source string or null; "\n            f"observed {type(value).__name__}"\n        )\n    text = value.strip()\n    if not text.isascii() or not text.isdigit() or len(text) != 3:\n        raise ValueError(f"coddepto must be exactly three ASCII digits or null: {value!r}")\n    return text\n'''
          new = '''def _optional_department(value: object) -> str | None:\n    if pd.isna(value):\n        return None\n    if not isinstance(value, str):\n        raise TypeError(\n            "coddepto must remain a source string or null; "\n            f"observed {type(value).__name__}"\n        )\n    if not value.strip():\n        raise ValueError("coddepto must be a non-empty source string or null")\n    return value\n'''
          if old not in text:
              raise SystemExit('expected _optional_department block not found')
          source.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_tartagalensis_circuits.py')
          text = tests.read_text()
          old = '"coddepto": None if (vintage == "2021" and codprov == "15") else "001",'
          new = ('"coddepto": (\n'
                 '                        None\n'
                 '                        if (vintage == "2021" and codprov == "15")\n'
                 '                        else ("01" if codprov == "24" else "001")\n'
                 '                    ),')
          if old not in text:
              raise SystemExit('expected synthetic coddepto fixture not found')
          text = text.replace(old, new, 1)
          marker = '    assert frame["reconstruction_status"].eq("unknown_feature_level").all()\n'
          insert = '''    source_native_width = frame[\n        frame["codprov"].eq("24") & frame["circuito"].eq("00001")\n    ].iloc[0]\n    assert source_native_width["coddepto"] == "01"\n    assert str(source_native_width["circuit_uid"]).endswith(":24:01:00001")\n'''
          if marker not in text:
              raise SystemExit('expected test insertion marker not found')
          tests.write_text(text.replace(marker, insert + marker, 1))

          config = Path('config/sources/tartagalensis_electoral_circuits.json')
          text = config.read_text()
          marker = '    "Twenty-nine 2021 source features have null coddepto according to the pinned README; those rows are preserved with explicit incomplete-identity status rather than imputed.",\n'
          addition = '    "coddepto is preserved as the source-native string, including source-native width; A8 does not pad, truncate, or reinterpret it as a Census department code.",\n'
          if marker not in text:
              raise SystemExit('expected config insertion marker not found')
          config.write_text(text.replace(marker, marker + addition, 1))
          PY
          python -m pip install -e ".[dev]"
          make check
          python -m pytest -q tests/test_tartagalensis_circuits.py
          rm .github/workflows/a8-native-coddepto-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve native Tartagalensis coddepto strings"
          git push origin HEAD:feat/tartagalensis-circuit-geographies

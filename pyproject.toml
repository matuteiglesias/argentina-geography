[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "censo-geography-release"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["shapely==2.1.1", "pyproj==3.7.1"]

[project.scripts]
censo-geography-release = "censo_geo.release:main"

[tool.setuptools.packages.find]
where = ["src"]
